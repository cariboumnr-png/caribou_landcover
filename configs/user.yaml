# =============================================================================
# USER CONFIGURATION
# -----------------------------------------------------------------------------
# This file provides inputs for the sequential experiment pipelines:
#
#   0. data-harmonize: Harmonizes raw inputs (S2, DEM, Labels) into canonical VRTs.
#   1. data-ingest: Ingests datasets, grid references, & domains.
#   2. data-prepare: Handles block splits & class balancing.
#   3. model-train: Configures model structure & session params.
# =============================================================================

# Root directory for experiment outputs, logs, and checkpoints
exp_root: ./experiment

data-harmonize:
  output_dpath: ./experiment/artifacts/harmonized_data
  # ---------------------------------------------------------------------------
  # Spatial Target & World Grid Tiling
  # ---------------------------------------------------------------------------
  reference_raster: ./experiment/input/reference_raster/sample_extent.tif
  target_crs: EPSG:3161
  target_resolution: 20.0
  tile_size: 256
  tile_overlap: 128

  # ---------------------------------------------------------------------------
  # Input Source Rasters (Features & Ground-Truth Labels)
  # ---------------------------------------------------------------------------
  # Path to the dataset metadata JSON manifest
  dataset_manifest: ./experiment/input/raw_data/manifest.json

  # ---------------------------------------------------------------------------
  # Resampling Rules
  # ---------------------------------------------------------------------------
  resampling_continuous: bilinear
  resampling_categorical: nearest


data-ingest:
  output_dpath: ./experiment/artifacts/ingested_data
  # Targeted harmonization run folder index, name, or path (null for latest)
  harmonization_run: null

  # ---------------------------------------------------------------------------
  # Domain Context Layer Settings
  # ---------------------------------------------------------------------------
  domain_ids_name: null
  domain_vec_name: null

  rebuild: true


data-prepare:
  output_dpath: ./experiment/artifacts/prepared_data
  # ---------------------------------------------------------------------------
  # Geographic AOI Block Selection (Optional)
  # ---------------------------------------------------------------------------
  # Explicit GeoTIFF raster paths for selecting blocks (null to use auto-split):
  test_aoi: ./experiment/input/reference_raster/sample_test_aoi.tif
  val_aoi: null
  train_aoi: null
  # Minimum block overlap ratio with AOI raster to be selected (0.0 to 1.0)
  aoi_min_overlap: 0.5
  # External test dataset catalog (optional alternative to test_aoi)
  test_catalog: null
  # Include only non-overlapping base grid blocks from test catalog
  non_overlapping_test_grid: true

  # ---------------------------------------------------------------------------
  # Automated Splitting & Class Balancing (For unassigned candidate pool)
  # ---------------------------------------------------------------------------
  # Ratio of unassigned blocks partitioned for validation (0.0 to 1.0)
  val_ratio: 0.20
  # Test partition ratio from unassigned pool (0.0 to disable test split)
  test_ratio: 0.00
  # Spatial buffer step distance to prevent spatial leakage into training
  buffer_step: 0
  # Oversampling target head name (null to disable)
  target_head: null
  # Map of class index (0-based) to oversampling reward (e.g., {1: 2.0})
  reward_classes: {}
  # Force rebuild splits & normalization even if they exist
  rebuild: true


model-train:
  output_dpath: ./experiment/results
  # ---------------------------------------------------------------------------
  # Model Architecture & Training Hyperparameters
  # ---------------------------------------------------------------------------
  # Model body name (choices: "unet", "unetpp", "unetppp")
  model_body: unetppp
  # Bottleneck type (choices: "conv", "transformer", "hybrid")
  bottleneck: transformer
  # Conditioning/fusion methods (choices: list of [concat, film])
  conditioners: [concat, film]
  # Pixel patch size for loader (must divide tile_size)
  patch_size: 128
  # Number of samples per training batch
  batch_size: 16
  # Maximum number of training epochs
  epochs: 10
  # Training loss weights for each prediction head.
  # Larger values increase a head's contribution to the total training loss,
  # causing the model to place more emphasis on optimizing that head.
  # Set to {} or null to weight all heads equally during training.
  head_loss_weights: {}
  # Validation metric weights for each prediction head.
  # Larger values increase a head's influence on the aggregated validation score,
  # making it more important when evaluating overall model performance.
  # Set to {} or null to weight all heads equally during validation.
  head_metrics_weights: {}
  # Note: Keys in head_loss_weights and head_metrics_weights must match exactly
  # if both are configured, e.g., ok if head_loss_weights are provided but
  # head_metrics_weights are set to {} or null